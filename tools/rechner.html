<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rechner</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;margin:0;padding:28px;background:#f5f6fb;color:#202438}.card{max-width:520px;margin:10px auto;padding:24px;border:1px solid #e0e3ed;border-radius:16px;background:white;box-shadow:0 10px 30px #18203a10}h1{font-size:23px}label{display:block;font-size:13px;margin:14px 0 6px}input,select,button{font:inherit;padding:10px;border:1px solid #cdd2e0;border-radius:8px;width:100%}button{margin-top:14px;background:#6552ca;color:white;border:0;cursor:pointer}.result{margin-top:18px;font-size:22px;font-weight:700}</style></head><body><main class="card"><h1>Beispiel-Rechner</h1><p>Ein Beispiel für eine eigenständige HTML-Datei, die du im Tools-Bereich verlinken kannst.</p><label for="a">Erste Zahl</label><input id="a" type="number" value="12"><label for="b">Zweite Zahl</label><input id="b" type="number" value="30"><button id="calc">Addieren</button><div id="result" class="result">Ergebnis: 42</div></main><script>document.querySelector("#calc").addEventListener("click",()=>{const a=Number(document.querySelector("#a").value),b=Number(document.querySelector("#b").value);document.querySelector("#result").textContent="Ergebnis: "+(a+b)});</script></body></html>
